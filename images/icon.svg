<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Browser window: pale frame above a near-white page -->
  <rect x="10" y="10" width="236" height="236" rx="44" fill="#f6f8f6" stroke="#cfd6d2" stroke-width="4"/>
  <path d="M12 54 V54 C12 30 30 12 54 12 H202 C226 12 244 30 244 54 V70 H12 Z" fill="#eef2ef"/>
  <!-- Active tab joined to the toolbar -->
  <path d="M30 70 C38 70 42 66 42 58 V44 C42 36 48 30 56 30 H120 C128 30 134 36 134 44 V58 C134 66 138 70 146 70 Z" fill="#f6f8f6"/>
  <g stroke="#cfd6d2" stroke-width="3">
    <line x1="12" y1="70" x2="30" y2="70"/>
    <line x1="146" y1="70" x2="244" y2="70"/>
  </g>
  <line x1="58" y1="50" x2="104" y2="50" stroke="#1b2320" stroke-width="9" stroke-linecap="round"/>
  <!-- Address bar -->
  <rect x="30" y="86" width="196" height="30" rx="15" fill="#ffffff" stroke="#cfd6d2" stroke-width="3"/>
  <line x1="50" y1="101" x2="130" y2="101" stroke="#5d6864" stroke-width="8" stroke-linecap="round"/>
  <!-- Ledger page: margin rule in warm ochre, ruled lines -->
  <g stroke="#dfe7e1" stroke-width="3">
    <line x1="30" y1="152" x2="226" y2="152"/>
    <line x1="30" y1="190" x2="226" y2="190"/>
  </g>
  <line x1="66" y1="132" x2="66" y2="226" stroke="#b8860b" stroke-width="6" stroke-linecap="round"/>
  <g stroke-linecap="round" stroke-width="12">
    <line x1="90" y1="172" x2="128" y2="172" stroke="#1b2320"/>
    <line x1="90" y1="210" x2="150" y2="210" stroke="#3d5f7a"/>
  </g>
  <!-- Leaf -->
  <path d="M224 132 C182 132 154 150 150 178 C180 182 214 168 224 132 Z" fill="#2d6a3b"/>
  <path d="M218 139 C199 151 178 163 156 174" fill="none" stroke="#f6f8f6" stroke-width="4" stroke-linecap="round"/>
</svg>
